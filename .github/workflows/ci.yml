name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: eddy_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s
          --health-timeout 5s --health-retries 10
    env:
      EDDY_TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/eddy_test?sslmode=disable
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      # Go plays the Go side of the interop tests.
      - uses: actions/setup-go@v5
        with:
          go-version-file: tests/support/gohelper/go.mod
          cache-dependency-path: tests/support/gohelper/go.sum
      - run: uv sync
      - run: make lint
      - run: uv run pytest --cov=eddy_pg --cov-report=term-missing --cov-report=xml --cov-fail-under=80
      - uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: coverage.xml
          fail_ci_if_error: false
