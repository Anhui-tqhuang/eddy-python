[project]
name = "eddy-pg"
version = "0.1.0"
description = "Reconcile loops for Python, with Postgres as the only moving part. Job-compatible with the Go eddy library."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Tianqiu Huang" }]
requires-python = ">=3.14"
keywords = ["postgres", "reconcile", "controller", "river", "queue"]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Framework :: AsyncIO",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.14",
    "Topic :: Database",
    "Typing :: Typed",
]
dependencies = [
    "psycopg[binary,pool]>=3.2",
    "pydantic>=2.6",
]

[project.urls]
Repository = "https://github.com/Anhui-tqhuang/eddy-python"
"Go library" = "https://github.com/Anhui-tqhuang/eddy"

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.24",
    "pytest-cov>=5",
    "pyhamcrest>=2.1",
    "ruff>=0.8",
    "mypy>=1.13",
]

[build-system]
requires = ["uv_build>=0.9.27,<0.10.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "eddy_pg"

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
markers = [
    "unit: no database needed",
    "integration: needs Postgres (EDDY_TEST_DATABASE_URL) and Go, for River's tables",
    "interop: also runs the Go eddy library against the same database",
]

[tool.ruff]
line-length = 100
target-version = "py314"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "ASYNC", "RUF"]

[tool.mypy]
strict = true
plugins = ["pydantic.mypy"]
files = ["src"]
